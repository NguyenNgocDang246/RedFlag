services:
  postgres:
    image: postgres:16-alpine
    container_name: phishgym-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phishgym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phishgym}
      POSTGRES_DB: ${POSTGRES_DB:-phishgym}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phishgym}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: phishgym-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SMTP giả cho dev: nhận mail, xem qua UI, không gửi ra ngoài
  mailpit:
    image: axllent/mailpit:latest
    container_name: phishgym-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI  ->  http://localhost:8025
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  pg_data:
  redis_data:
