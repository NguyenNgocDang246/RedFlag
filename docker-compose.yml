services:
  postgres:
    image: postgres:16-alpine
    container_name: redflag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-redflag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-redflag}
      POSTGRES_DB: ${POSTGRES_DB:-redflag}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-redflag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redflag-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dev SMTP sink: catches mail with a web UI, never sends out
  mailpit:
    image: axllent/mailpit:latest
    container_name: redflag-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI  ->  http://localhost:8025
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  pg_data:
  redis_data:
